<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <script>
    const fun = (event) => {
        event.preventDefault();
    const UserName = document.getElementById("u_id").value;
    const password = document.getElementById("pass").value;

   
        console.log(password);
    if(password.length < 8){
        
        alert("Minimum 8 characters");
        return;
    }
   
        alert("Form submitted by "+UserName);
    };
</script>
</head>
<body>
    <h1>
        Application Form
    </h1>
    <form onsubmit=fun(event)>
        <table>
       <tr> <td> <input type="text" placeholder="UserName" id="u_id"/> </td> </tr>
       <tr> <td> <input type="password" placeholder="password" id="pass"/> </td> </tr>
       <tr> <td> <input type=submit /> </td></tr>
        </table>
    </form>
</body>

</html>
